# 促销雷达配置 —— 改这个文件就能增减扫描内容，不用动代码

# Gemini 模型（免费层），按顺序尝试：第一个忙或不存在，就自动换下一个
models:
  - gemini-flash-lite-latest
  - gemini-3.1-flash-lite
  - gemini-flash-latest

pause_seconds: 5            # 每次调用 Gemini 之间的间隔
news_days: 10               # 只看最近几天的新闻
max_news_per_category: 40   # 每个类别最多交给 Gemini 几条新闻
keep_undated_days: 21       # 没写截止日的促销，最后一次看到后保留几天

# ── 扫描类别 ──
# news_queries：用 Google News（马来西亚版）搜索的关键词，英文效果最好
# pages：固定促销网页（可选）。页面要能直接读到文字，用 JavaScript 动态加载的页面读不到
categories:
  - category: 机票
    news_queries:
      - AirAsia promo
      - Malaysia Airlines promotion fares
      - Batik Air promo
      - Firefly promo fares
      - Scoot sale Malaysia
      - Singapore Airlines Malaysia promotion
      - Cathay Pacific Malaysia fares sale
      - flight sale Malaysia
      - tiket murah promosi penerbangan
    pages: []

  - category: 酒店旅游
    news_queries:
      - MATTA Fair
      - hotel promotion Malaysia
      - travel package promotion Malaysia
      - Agoda Malaysia sale
      - Trip.com Malaysia promo
    pages: []

  - category: 银行卡
    news_queries:
      - UOB Malaysia credit card promotion
      - Hong Leong Bank credit card promotion
      - AmBank credit card promotion
      - Maybank credit card promotion
      - CIMB credit card promotion
      - credit card cashback promotion Malaysia
    pages: []

  - category: 家私
    news_queries:
      - IKEA Malaysia sale
      - furniture sale Malaysia
      - furniture fair Penang
      - Home's Harmony sale
      - Courts Malaysia sale
      - Harvey Norman Malaysia sale
    pages: []

# ── 过滤 ──
# 含这些关键词的促销直接丢掉（中东航空公司或中转城市）
exclude_keywords:
  - Emirates
  - Qatar Airways
  - Etihad
  - Saudia
  - Gulf Air
  - Oman Air
  - flydubai
  - Air Arabia
  - Dubai
  - Doha
  - Abu Dhabi
  - 迪拜
  - 多哈
  - 阿布扎比
  - 阿联酋航空
  - 卡塔尔航空
