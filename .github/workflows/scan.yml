name: 每日扫描促销

on:
  schedule:
    - cron: "0 0 */3 * *"   # 每天 UTC 00:00 = 马来西亚早上 8 点
  workflow_dispatch:       # 也可以在 Actions 页面手动点 Run

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 扫描
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scanner/scan.py

      - name: 有变化就提交
        run: |
          git config user.name "promo-radar-bot"
          git config user.email "promo-radar-bot@users.noreply.github.com"
          git add docs/deals.json
          git diff --cached --quiet || git commit -m "更新促销 $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d')"
          git push
